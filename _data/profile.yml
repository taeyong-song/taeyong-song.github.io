about:
  - I am a Ph.D. student in the Department of Architecture and Architectural Engineering at Seoul National University. My research sits at the intersection of building physics, building performance simulation, and artificial intelligence.
  - I am interested in models that are not only accurate, but also physically meaningful and transferable when building data are scarce. My current work explores physics-embedded learning, reduced-order thermal models, and data-efficient methods for understanding and predicting building behavior.

research_interests:
  - Physics-embedded and physics-informed machine learning
  - Building energy and thermal performance
  - Building performance simulation and reduced-order modeling
  - Data-efficient learning, transfer learning, and digital twins

projects:
  - title: Physics-Embedded Thermal Modeling
    summary: Hybrid models that connect RC thermal dynamics with neural networks.
    description: First-principles equations provide an interpretable thermal backbone, while neural networks learn parameters and residual structure from limited measurements. The broader goal is dependable prediction beyond the conditions represented in training data.
    related_url: /publications/

  - title: Data-Efficient Building Models
    summary: Transfer learning and model adaptation under scarce building data.
    description: This work studies how knowledge learned from one building or operating condition can support modeling in another while preserving physical plausibility.
    related_url: /publications/

  - title: Causal Models for Retrofit Decisions
    summary: Simplified models for transparent and robust building-energy decisions.
    description: This research examines whether simplified, causality-aware models can preserve the relationships and sensitivities that matter for building-energy retrofit decisions.
    related_url: /publications/


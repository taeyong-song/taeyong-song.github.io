about:
  - I am a Ph.D. student in the Building Simulation Lab (BS Lab) at Seoul National University (SNU), advised by Professor Cheol-Soo Park. My research sits at the intersection of building physics, building performance simulation, and artificial intelligence.
  - I am interested in developing physically meaningful and transferable models grounded in data across building systems, performance, and operations.

research_interests:
  - Physics-Embedded ML
  - Physics-Informed ML
  - Building Energy & Thermal Performance
  - Building Performance Simulation
  - Reduced-Order Modeling
  - Data-Efficient Learning
  - Transfer Learning
  - Digital Twins

